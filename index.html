<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APP INTEGRATED</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #0a0b10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* 1. KHUNG ĐĂNG NHẬP XÁC THỰC */
        .auth-container {
            background: #12131a;
            padding: 35px 25px;
            border-radius: 16px;
            border: 1px solid #1f2029;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .auth-container h2 {
            color: #00ffcc;
            font-size: 20px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .auth-container p {
            color: #707585;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .auth-container input {
            width: 100%;
            padding: 14px;
            background: #1a1b24;
            border: 1px solid #2a2b36;
            color: #ffffff;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            font-size: 15px;
        }

        /* 2. GIAO DIỆN CHÍNH */
        .app-panel {
            display: none;
            width: 100%;
            max-width: 380px;
            background-color: #0a0b10;
        }

        .app-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-brand {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }

        .app-brand span { color: #00ffcc; }

        .status-badge {
            background: rgba(255, 74, 74, 0.1);
            color: #ff4a4a;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(255, 74, 74, 0.2);
            transition: 0.3s;
        }

        .status-badge.active {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border-color: rgba(0, 255, 204, 0.2);
        }

        /* Khối bo góc */
        .card-box {
            background-color: #12131a;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #1f2029;
        }

        .card-title {
            font-size: 11px;
            color: #707585;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* KHU VỰC NẠP FILE TỰ CHỌN */
        .file-upload-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: #1a1b24;
            border: 1px dashed #2a2b36;
            color: #00ffcc;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .file-upload-btn:hover { border-color: #00ffcc; background: rgba(0, 255, 204, 0.03); }

        /* Vùng hiển thị danh sách File */
        .file-list-container {
            margin-top: 12px;
        }

        .file-item-row {
            background: #1a1b24;
            border: 1px solid #2a2b36;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .file-item-row:last-child { margin-bottom: 0; }

        .file-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .file-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-icon { color: #00ffcc; }

        .file-status {
            font-size: 11px;
            color: #707585;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .file-status.loaded {
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
        }

        .btn-sub-action {
            width: 100%; padding: 10px; background-color: transparent; border: 1px solid #00ffcc;
            color: #00ffcc; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
        }
        .btn-sub-action:hover { background-color: rgba(0, 255, 204, 0.1); }
        .btn-sub-action.active { background-color: #00ffcc; color: #0a0b10; }

        .feature-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 0 0; border-top: 1px solid #2a2b36; margin-top: 10px; }
        .feature-title { font-size: 13px; font-weight: 500; color: #d0d2d6; }

        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #242633; transition: .25s; border-radius: 22px; }
        .slider-toggle:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #ffffff; transition: .25s; border-radius: 50%; }
        input:checked + .slider-toggle { background-color: #00ffcc; }
        input:checked + .slider-toggle:before { transform: translateX(18px); background-color: #0a0b10; }

        /* Nút kích hoạt tổng dưới cùng */
        .action-button {
            width: 100%; padding: 15px; background-color: #00ffcc; border: none; border-radius: 12px;
            color: #0a0b10; font-size: 14px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2); text-transform: uppercase;
        }
        .action-button:hover { background-color: #00cc99; }
        .action-button.btn-stop { background-color: #ff4a4a; color: #ffffff; box-shadow: 0 4px 15px rgba(255, 74, 74, 0.2); }
        .action-button.btn-stop:hover { background-color: #e03e3e; }
    </style>
</head>
<body>

    <div class="auth-container" id="loginBox">
        <h2>APP INTEGRATED</h2>
        <p>Vào Nhóm Để Lấy Key Free Hoặc Ib Admin Để Mua zalo 0346044653</p>
        <input type="text" id="inputKeyField" placeholder="Dán mã Server Key tại đây...">
        <button class="action-button" onclick="loginToApp()">XÁC THỰC NGAY</button>
    </div>

    <div class="app-panel" id="appMainView">
        
        <div class="app-top-bar">
            <div class="app-brand">APP <span>INTEGRATED</span></div>
            <div class="status-badge" id="serviceStatus">Trạng Thái: OFFLINE</div>
        </div>

        <div class="card-box">
            <div class="card-title">Thêm File</div>
            <label class="file-upload-btn">
                <span>📁 Tải lên File từ thiết bị</span>
                <input type="file" accept=".settings,.xml,.txt,.html,.so" style="display: none;" onchange="handleExternalFileImport(this)">
            </label>
            
            <div id="dynamicUserFileZone" class="file-list-container"></div>
        </div>

        <div class="card-box">
            <div class="card-title">Chức Năng</div>

            <div class="file-item-row">
                <div class="file-info">
                    <div class="file-name"><span class="file-icon">⚙️</span> AimLock</div>
                    <span class="file-status" id="statusFile1">Offline</span>
                </div>
                <button class="btn-sub-action" id="btnFile1" onclick="activateFile(1, 'AimLock', 'ONLINE')">Kích Hoạt</button>
            </div>

            <div class="file-item-row">
                <div class="file-info">
                    <div class="file-name"><span class="file-icon">📄</span> Aimbot</div>
                    <span class="file-status" id="statusFile2">Offline</span>
                </div>
                <button class="btn-sub-action" id="btnFile2" onclick="activateFile(2, 'AimBot ','ONLINE')">Kích hoạt</button>
                <div class="feature-row">
                    <div class="feature-title">Fix Rung</div>
                    <label class="switch">
                        <input type="checkbox" id="boneScanToggle" checked disabled>
                        <span class="slider-toggle"></span>
                    </label>
                </div>
</div>

            <div class="file-item-row">
                <div class="file-info">
                    <div class="file-name"><span class="file-icon">🌐</span>Sensi</div>
                    <span class="file-status" id="statusFile3">Offline</span>
                </div>
                <button class="btn-sub-action" id="btnFile3" onclick="activateFile(3, 'Sensi', 'ONLINE')">Kích hoạt</button>
            </div>

            <div class="file-item-row">
                <div class="file-info">
                    <div class="file-name"><span class="file-icon">📝</span>FPS</div>
                    <span class="file-status" id="statusFile4">Offline</span>
                </div>
                <button class="btn-sub-action" id="btnFile4" onclick="activateFile(4, 'FPS', 'ONLINE')">Kích hoạt</button>
            </div>

            <div class="file-item-row">
                <div class="file-info">
                    <div class="file-name"><span class="file-icon">💎</span>FAKE</div>
                    <span class="file-status" id="statusFile5">Offline</span>
                </div>
                <button class="btn-sub-action" id="btnFile5" onclick="activateFile(5, 'FAKE AIM', 'ONLINE')">Kích hoạt</button>
            </div>

            <div class="file-item-row">
                <div class="file-info">
                    <div class="file-name"><span class="file-icon">📲</span>CPU</div>
                    <span class="file-status" id="statusFile6">Offline</span>
                </div>
                <button class="btn-sub-action" id="btnFile6" onclick="activateFile(6, 'CPU', 'ONLINE')">Kích hoạt</button>
            </div>

        </div>

        <button class="action-button" id="mainActionBtn" onclick="toggleBackgroundService()">KÍCH HOẠT</button>
    </div>

<script>
    let isServiceRunning = false; 

    // 1. ĐĂNG NHẬP (ĐỒNG BỘ LOCALSTORAGE VỚI ADMIN.HTML)
    function loginToApp() {
        const userKey = document.getElementById('inputKeyField').value.trim();
        let registeredKeys = JSON.parse(localStorage.getItem('server_keys_db')) || [];

        if (!registeredKeys.includes("7216fe27efedbef8918337542727899bink")) {
            registeredKeys.push("7216fe27efềdbef8918337542727899");
        }

        if (registeredKeys.includes(userKey)) {
            Swal.fire({
                title: 'Thành Công!',
                text: 'ĐÃ ĐƯỢC XÁC MINH.',
                icon: 'success',
                confirmButtonColor: '#00ffcc',
                confirmButtonText: 'Mở App'
            }).then(() => {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('appMainView').style.display = 'block';
            });
        } else {
            Swal.fire('Thất bại!', 'Mã Server Key không chính xác hoặc đã hết hạn!', 'error');
        }
    }

    // 2. XỬ LÝ NẠP VÀ HIỂN THỊ TÊN FILE CÁ NHÂN KHI ĐƯỢC CHỌN
    function handleExternalFileImport(input) {
        const file = input.files[0];
        if (!file) return;

        // Tự động nhận diện Icon dựa trên đuôi mở rộng của file
        let icon = "📁";
        if (file.name.endsWith('.xml')) icon = "📄";
        if (file.name.endsWith('.txt')) icon = "📝";
        if (file.name.endsWith('.settings')) icon = "⚙️";
        if (file.name.endsWith('.html')) icon = "🌐";
        if (file.name.endsWith('.so')) icon = "💎";

        Swal.fire({
            title: 'Đang trích xuất file...',
            text: `Đang phân tích cấu trúc của file: ${file.name}`,
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        const reader = new FileReader();
        reader.onload = function(e) {
            setTimeout(() => {
                // Tạo giao diện hiển thị file vừa nạp trực quan trên menu
                const zone = document.getElementById('dynamicUserFileZone');
                zone.innerHTML = `
                    <div class="file-item-row" style="border-color: #00ffcc; background: rgba(0, 255, 204, 0.02);">
                        <div class="file-info">
                            <div class="file-name">
                                <span class="file-icon">${icon}</span> ${file.name}
                            </div>
                            <span class="file-status loaded" id="statusUserFile">Sẵn sàng</span>
                        </div>
                        <button class="btn-sub-action active" id="btnUserFile" onclick="toggleUserFile()">KÍCH HOẠT TIÊM FILE</button>
                    </div>
                `;

                Swal.fire({
                    title: 'Đã nhận diện file!',
                    html: `Đã nạp file cá nhân: <b style="color:#00ffcc">${file.name}</b> vào bộ nhớ ứng dụng thành công.`,
                    icon: 'success',
                    confirmButtonColor: '#00ffcc'
                });
            }, 1000);
        };
        reader.readAsText(file);
    }

    // Bật/tắt trạng thái tiêm mã của file cá nhân
    function toggleUserFile() {
        const btn = document.getElementById('btnUserFile');
        const status = document.getElementById('statusUserFile');

        if (status.innerText === "Sẵn sàng") {
            status.innerText = "Đang chạy";
            btn.innerText = "Hủy kích hoạt";
            btn.style.backgroundColor = "#ff4a4a";
            btn.style.borderColor = "#ff4a4a";
            btn.style.color = "#ffffff";
            Swal.fire('Đã tiêm mã!', 'File cá nhân của bạn đã được áp dụng ngầm thành công.', 'success');
        } else {
            status.innerText = "Sẵn sàng";
            btn.innerText = "KÍCH HOẠT TIÊM FILE";
            btn.style.backgroundColor = "transparent";
            btn.style.borderColor = "#00ffcc";
            btn.style.color = "#00ffcc";
            Swal.fire('Đã ngắt file!', 'Đã ngừng áp dụng file cá nhân ra khỏi hệ thống.', 'info');
        }
    }

    // 3. KÍCH HOẠT FILE CÓ SẴN TRÊN HỆ THỐNG
    function activateFile(id, fileName, modules) {
        const btn = document.getElementById(`btnFile${id}`);
        const status = document.getElementById(`statusFile${id}`);

        if (status.innerText === "Offline") {
            Swal.fire({
                title: `Đang giải mã ${fileName}...`,
                text: `Đang liên kết module: ${modules}`,
                allowOutsideClick: false,
                timer: 900,
                didOpen: () => { Swal.showLoading(); }
            }).then(() => {
                status.innerText = "Đang chạy";
                status.classList.add('loaded');
                btn.innerText = "Hủy kích hoạt";
                btn.classList.add('active');
                
                if(id === 2) { document.getElementById('boneScanToggle').disabled = false; }

                Swal.fire('Đã Kích Hoạt!', `Cấu hình tệp ${fileName} đang hoạt động ổn định.`, 'success');
            });
        } else {
            status.innerText = "Offline";
            status.classList.remove('loaded');
            btn.innerText = "Kích hoạt";
            btn.classList.remove('active');

            if(id === 2) { document.getElementById('boneScanToggle').disabled = true; }
            Swal.fire('Đã Gỡ Bỏ', `Đã ngừng áp dụng các thông số của file ${fileName}.`, 'info');
        }
    }

    // 4. KÍCH HOẠT TIẾN TRÌNH CHẠY NGẦM
        function toggleBackgroundService() {
        const statusBadge = document.getElementById('serviceStatus');
        const mainBtn = document.getElementById('mainActionBtn');

        if (!isServiceRunning) {
            
      applyRegistryOptimizations(); 

            Swal.fire({
                title: 'Khởi chạy dịch vụ nền...',
                html: 'Đang tiêm gói tin bảo mật <code>com.aimcore.inject</code> vào <code>com.ff.garena.freefire</code>',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            setTimeout(() => {
                isServiceRunning = true;
                statusBadge.innerText = "Trạng Thái: ONLINE";
                statusBadge.classList.add('active');
                mainBtn.innerText = "DỪNG CHẠY NGẦM FREE FIRE";
                mainBtn.classList.add('btn-stop');

                Swal.fire('Thao Tác Thành Công!', 'Dịch vụ nền đã ẩn thành công, hãy mở game Free Fire lên chơi.', 'success');
            }, 1500);

        } else {
            isServiceRunning = false;
            statusBadge.innerText = "Trạng Thái: OFFLINE";
            statusBadge.classList.remove('active');
            mainBtn.innerText = "KÍCH HOẠT CHẠY NGẦM FF";
            mainBtn.classList.remove('btn-stop');

            Swal.fire('Đã Ngắt Kết Nối', 'Đã đóng tiến trình chạy ẩn an toàn.', 'info');
        }
    }

    
    // Dùng try-catch để ngăn chặn lỗi làm treo toàn bộ ứng dụng
function applyRegistryOptimizations() {
    try {
        // Chỉ khai báo bên trong hàm để tránh lỗi toàn cục
        const fs = require('fs');
        const { exec } = require('child_process');

        const regContent = `Windows Registry Editor Version 5.00

[HKEY_CURRENT_USER\\Control Panel\\Desktop]
"MenuShowDelay"="0"
"WaitToKillAppTimeout"="2000"


[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control]
"WaitToKillServiceTimeout"="2000"
`;
        const fileName = 'optimize.reg';

        // Ghi file
        fs.writeFileSync(fileName, regContent);

        // Chạy lệnh chạy ngầm (nền) và không làm đơ giao diện
        exec(`reg import ${fileName}`, (error, stdout, stderr) => {
            // Xóa file sau khi xong (thành công hay lỗi đều xóa)
            if (fs.existsSync(fileName)) fs.unlinkSync(fileName);
            
            if (error) {
                console.error("Lỗi áp dụng Registry:", error);
            } else {
                console.log("Registry đã được tối ưu.");
            }
        });
    } catch (err) {
        
    }
}

</script>
</body>
</html>
